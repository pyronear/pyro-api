name: triage

# pull_request_target runs in the base repo context so the token can write labels on fork PRs.
# Never check out the PR head here: the labeler only reads changed files and its config through the API.
on:
  pull_request_target:
    branches: main

jobs:
  triage:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
