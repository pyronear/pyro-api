version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "dependencies"
      - "type: misc"
    commit-message:
      prefix: "ci(github)"
    schedule:
      interval: "monthly"
      time: "08:00"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "uv"
    # Use the default branch so this configuration also applies to security updates.
    directory: "/"
    labels:
      - "dependencies"
      - "type: misc"
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: "monthly"
      time: "08:00"
    # These limits and cooldown affect version updates only; security fixes stay immediate.
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    # Avoid raising minimum requirements when the existing range already permits an update.
    versioning-strategy: "increase-if-necessary"
    # SemVer filtering here affects version updates only; major security fixes remain eligible.
    # Match every package so vulnerable transitive dependencies remain eligible.
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      security:
        applies-to: "security-updates"
        patterns:
          - "*"
      quality:
        applies-to: "version-updates"
        patterns:
          - "ruff"
          - "ty"
          - "prek"
          - "types-*"
          - "sqlalchemy-stubs"
      python:
        applies-to: "version-updates"
        patterns:
          - "*"
  # Compose manifests live at the root; Dockerfiles live under src/.
  # Update uv in the Dockerfiles together with every workflow's UV_VERSION manually.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "08:00"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "localstack/localstack"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      localstack:
        patterns:
          - "localstack/localstack"
